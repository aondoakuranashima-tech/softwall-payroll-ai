services:
  - type: web
    name: softwall-payroll-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace apps/web
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: softwall-payroll-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6-luna"
